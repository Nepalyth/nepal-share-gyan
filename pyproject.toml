[project]
name = "share-gyan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karinastha", email = "karinashrestha19@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
